name: macOS build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: ./scripts/bootstrap.sh
      - name: Unit tests
        run: swift test
      - name: Release app
        run: ./scripts/build.sh release
      - name: Package experimental app
        run: ditto -c -k --sequesterRsrc --keepParent build/PadMirror.app build/PadMirror-experimental.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PadMirror-experimental
          path: build/PadMirror-experimental.zip

  wireless:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Native engine dependencies
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja pkg-config gstreamer libplist openssl@3
      - name: Package USB + AirPlay DMG
        run: ./scripts/package.sh
      - name: Verify actual bundled runtime
        run: python3 scripts/verify-airplay-bundle.py build/PadMirror.app
      - name: Package wireless experiment
        run: ditto -c -k --sequesterRsrc --keepParent build/PadMirror.app build/PadMirror-wireless-experimental.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PadMirror-wireless-experimental
          path: |
            build/PadMirror-wireless-experimental.zip
            build/*usb-airplay*.dmg
            build/*usb-airplay*.sha256
